  - id: DR-058
    title: 排障任务连接飞控失败后一直“执行中”，取消后飞机仍被占用，之后所有任务和仿真操作都被拦
    status: verified
    found_by: 2026-10-17 负责人人工测试（1.10、1.11、1.16、1.17）：任务 cd719112c6 收到请求后 8 分钟没有下一步，取消后左下角仍显示执行中
    cause: 排障任务先占用飞机，再连接飞控，连接这一步写在 try 外面；连接失败时异常直接跳出，既没有写入最终状态，也没有释放占用。取消只改数据库状态，卡住的后台任务不检查取消标志。巡检任务的异常路径里“紧急返航”失败时同样释放不了占用。
    fix: 占用之后的每一步都在 try 里，finally 一定释放；巡检任务异常路径的返航失败不再阻止释放；后台任务登记 Future，取消后 15 秒仍未停止且飞机在地面时强制结束；查询仿真状态时自愈：占用者在数据库里已结束、后台也没有执行实例就释放；排障每一步发进度事件（连接飞控、检查试飞空间……）。
    verification: 单元测试（连接失败后释放并写入失败原因；已结束任务被自愈释放）；实测：诊断试飞中取消，任务记为已取消、飞机返航、参数恢复、占用释放。
  - id: DR-059
    title: 启动仿真时请求要等 30 秒以上，期间按钮全灰；中途停止后所有启动按钮一直灰色；重启时偶发 500
