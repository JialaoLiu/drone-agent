# 问题记录。每个真实遇到的问题一条，详细过程见 engineering-log.md。
# status: open / fixed / verified（修复后经评测或实测确认）
format_version: 1
project: drone-agent
updated: "2026-10-16"
bugs:
  - id: DR-001
    title: PX4 与 Gazebo 互相找不到
    status: verified
    found_by: 首次启动仿真
    cause: Gazebo 的服务发现默认走组播，本机报 “No route to host”。
    fix: 启动脚本固定 GZ_IP=127.0.0.1，只走本机回环。
    verification: PX4 正常连接 Gazebo 世界，飞行试验通过。
  - id: DR-002
    title: 加了 Metal 渲染参数后，相机和整个仿真卡住
    status: verified
    found_by: 按日志里的渲染错误提示排查
    cause: 传感器渲染线程卡在初始化，阻塞仿真步进；原来那条 Ogre 错误只是插件探测失败，渲染其实正常。
    fix: 不加 Metal 参数；脚本中注明那条错误可以忽略。
    verification: 用只有一个相机的最小场景逐个比较参数，相机出图正常、飞控可解锁。
  - id: DR-003
    title: MAVSDK v4 接口变化，旧写法报错
    status: verified
    found_by: 第一次飞行脚本
    cause: v4 改为原生绑定，插件需要显式构造。
    fix: 按 v4 重写飞行封装；同一个 UDP 端口只建一个 MAVSDK 实例，重连时复用。
    verification: 起飞、移动、云台、取图、返航全流程通过。
  - id: DR-004
    title: PX4 不认自定义机型目录
    status: verified
    found_by: 接入双相机机型
    cause: PX4 启动脚本内部会重新加载自己的环境，覆盖外部设置的 PX4_GZ_MODELS。
    fix: 巡检机直接写进场景文件；PX4 用 PX4_GZ_MODEL_NAME 连接已有的模型。
    verification: PX4 日志显示连接到 x500_inspect_0，两台相机都出图。
  - id: DR-005
    title: 相机桥端口被占用
    status: verified
    found_by: 启动相机桥
    cause: 本机 8765 端口已被另一个程序使用。
    fix: 改用 8874，可配置。
    verification: 相机桥正常提供照片和位姿。
  - id: DR-006
    title: 第一版场景太简单，体现不出近距复核的价值
    status: verified
    found_by: 视觉模型首次测试（只初筛就 10/10，没有误报）
    cause: 缺陷太明显，也没有干扰。
    fix: 轻微缺陷改细、改暗；15% 的正常板加阴影或反光；太阳方向随场景随机。
    verification: 只初筛检出 7/10、误报 4 块；全部复核后检出 10/10、误报 0 块。
  - id: DR-007
    title: 复核把真缺陷悄悄排除
    status: verified
    found_by: 实时任务对照标准答案（检出率 0%）
    cause: 复核结论无法识别时，代码默认判为“正常”。
    fix: 结论严格规范化，无法识别时判为“不确定”；初筛很确定、复核却判正常时再看一次；规则放进 inspection.py，实时任务与评测共用。
    verification: 同一场景重新执行，3/3 检出、误报 0；新增单元测试。
  - id: DR-008
    title: 后排板的下边缘被前排挡住，误判为“缺失”
    status: verified
    found_by: 全面巡检对照标准答案（误报 D-R2-C04）
    cause: 斜上方拍摄时，前排板遮住后排板的下边缘，形成黑色条带。
    fix: 巡检员的判断说明里写明遮挡的样子；“缺失”必须是整块板都看不到电池片。
    verification: 离线评测中，全部复核的误报降到 0–1 次（6 次运行）。
  - id: DR-009
    title: 轻微污损被当成反光
    status: verified
    found_by: 离线评测（全部复核仍漏检轻微污损）
    cause: 场景生成器把轻微污损画成了半透明，和“半透明的亮区是反光”这条规则冲突；是数据不真实。
    fix: 轻微污损改为面积小但不透明；重新生成场景并重新录制。
    verification: 全部复核的轻微缺陷检出率提高到 93%。
  - id: DR-010
    title: 返航高度超出场地限高
    status: verified
    found_by: 检查实时任务的返航过程
    cause: PX4 默认返航高度是 60 米，场地限高 40 米。
    fix: 正常返航由程序沿已校验的航线执行；失联保护的返航高度设为 30 米。
    verification: 多次任务返航高度不超过拍摄高度。
