  - id: DR-029
    title: 仿真状态异常时近照对不准，疑似缺陷全部停在“待确认”
    status: verified
    found_by: 制作使用说明配图的实时任务（任务 934c1c4e15、4a30e36808）
    cause: 当时仿真变慢，PX4 报加速度计超时，高度估计比真实位置高 2–3 米；变焦相机按估计位置瞄准，板落在画面外。第二次任务直接因无法在 25 秒内到达航点而失败返航。系统没有在起飞前发现这些异常。
    fix: |
      新增 health.py（安全员的确定性规则）：
      - 飞行前检查：飞控自检（传感器校准、位置估计）、最近 60 秒的传感器超时、仿真速度、位置估计与仿真真实位置之差、电脑负载（只提示）。规划通过安全校验后检查一次，起飞前（每个架次）再查一次，不通过则拒绝起飞并给出处理建议。
      - 飞行中：每次拍摄时比较飞控估计位置与真实位置，水平超过 2.5 米或高度超过 1.5 米即中止任务并返航。
      - 近照中没有目标板时，悬停 3 秒重新对准再拍一次；仍失败则标为“未能对准”。未确认的原因分为未能对准、看不清、电量不够、模型不可用，网页和报告分别显示。
      - 网页顶部显示飞行前检查状态，计划卡片显示检查单。
    verification: |
      - 单元测试用当时的实测数值（估计 18.8 米、真实 16.4 米）判定为漂移，40 个测试通过；
      - 实时任务（f58dcd587c，solar_46 的 A、C 两列）：飞行前检查通过，每次拍摄的位置偏差不超过 0.2 米，检出率、精确率、类型正确率均 100%；
      - 用 40 个满载进程把负载压到 34，仿真速度仍为 99%，未能复现漂移：说明当时的原因不只是 CPU 占用（可能是磁盘映像读写或仿真长时间运行），因此负载只作提示，拦截依据是传感器超时与位置漂移。
      - 2026-10-16 复测：退出其他占资源的程序后，solar_46 两列与 solar_63 全部复核（2 个架次）的实时任务检出率、精确率均 100%，飞行前检查全部通过；全部复核任务中触发 1 次“近照未对准、重新对准”并成功。当时的漂移仍未在受控条件下复现，根因（CPU 以外的磁盘映像读写或长时间运行）未确认。
  - id: DR-030
    title: 切换场景（仿真重启）后飞行前检查一直超时，网页提示“无法完成检查：”且原因为空
    status: verified
    found_by: 2026-10-16 夜间实测，从 solar_46 切换到 solar_63 后
    cause: 每次检查都临时新建飞控自检订阅；仿真重启后沿用同一个飞控连接，新建的订阅收不到数据，20 秒超时。超时异常的文字为空，提示里没有原因。
    fix: 飞控自检改为常驻订阅、缓存最新结果，检查时取 5 秒内的结果；超时提示改为“超时”。
    verification: 重启后端、检查通过，再切换场景重启仿真，40 秒后检查通过（仿真速度 99%，偏差 0.0 米）。
  - id: DR-031
    title: 起飞只成功一半（已离地未到高度）时不返航
    status: verified
    found_by: 2026-10-16 深度代码审查 H01
    cause: 任务的“已起飞”标记只在起飞动作完整成功后写入；返航节点只看这个标记。
    fix: 返航节点以飞控遥测（在空中或已解锁）为准；飞行异常时同样按遥测记录是否在空中。
    verification: 替身飞控复现（离地 4 米后起飞超时）后会执行返航；单元测试 test_return_home_when_takeoff_half_succeeded。
  - id: DR-032
    title: 取消与一键返航后，原任务仍可能继续发送起飞或航点指令
    status: verified
    found_by: 2026-10-16 深度代码审查 H02
    cause: 取消只改数据库状态；起飞前与各条指令之间不检查；一键返航后原步骤仍继续下发航点。排障试飞完全不读取取消状态。
    fix: 飞控层增加指令优先权：飞控返航接管后、或当前任务已取消时，起飞、航点、云台等普通指令一律拒绝，等待中也会立即结束；返航与降落不受限制。巡检与排障都在开始时登记取消检查。前端一键返航按钮不再按可能延迟的“在空中”遥测禁用。
    verification: 单元测试（返航接管后航点被拒、等待中取消立即结束、取消后仍可降落、已取消任务不起飞）；实测：爬升中取消 19 秒落地且无后续指令；拍摄中一键返航后只等待降落、无后续航点或云台指令。
  - id: DR-033
    title: 排障试飞与场景录制绕过安全员
    status: verified
    found_by: 2026-10-16 深度代码审查 H03
    cause: 排障直接起飞并飞固定航点，录制直接直线飞各拍摄点，都不做场地校验与飞行前检查；种子 25、41、57、94 的试飞航线离树太近，solar_1 的录制航段穿过禁飞区。
    fix: 排障试飞航线先用安全员规则校验，按东、北、西、南选择第一个安全的横移方向，都不安全则拒绝执行；试飞前做飞行前检查。录制先展开含绕行的完整航线并校验，通过飞行前检查后才起飞，出错即返航。
    verification: 100 个种子的试飞航线全部有安全方向（上述 4 个改为向北）；单元测试；实测排障（yaw_slow）正确、参数已恢复。
  - id: DR-034
    title: 等待飞控就绪与云台列表的订阅没有真正的超时
    status: verified
    found_by: 2026-10-16 深度代码审查 H04
