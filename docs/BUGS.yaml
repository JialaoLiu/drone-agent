    verification: 单元测试用永不产出的订阅，两处都在上限内报错。
  - id: DR-035
    title: 并发确认同一任务会重复恢复执行
    status: verified
    found_by: 2026-10-16 深度代码审查 H05
    cause: 确认接口忽略条件更新的结果；运行时允许同一任务编号重复认领。
    fix: 条件更新成功的请求才恢复，其余返回 409；运行时登记执行实例，同一任务同时只允许一个。
    verification: 单元测试。
  - id: DR-036
    title: 初筛丢弃无法识别的结论，输出结构错误时当成“没有可疑板”
    status: verified
    found_by: 2026-10-16 深度代码审查 H06（DR-007 在初筛环节的遗漏）
