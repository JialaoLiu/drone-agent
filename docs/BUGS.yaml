  - id: DR-056
    title: 重建虚拟环境后找不到 droneagent 包（ModuleNotFoundError）
    status: verified
    found_by: 2026-10-16 运行新增的 recheck 评测
    cause: 项目在桌面目录下，桌面开启了 iCloud 同步；iCloud 会给以点开头的目录（.venv）里的文件加上“隐藏”标记。Python 3.12 加载 .pth 时跳过带隐藏标记的文件，可编辑安装的路径文件因此失效。这次改代码后 uv 重新安装，新写出的路径文件被标记；之前为什么没出问题没有查清（推测旧文件写出时还没被同步进程处理）。site-packages 里出现的“_editable_impl_droneagent 2.pth”等副本也是同步冲突留下的。
    fix: 虚拟环境移到 backend/venv.nosync（名字不以点开头，且以 .nosync 结尾，iCloud 不处理），backend/.venv 改为指向它的软链接，uv 与脚本不用改；.gitignore 同步更新。只改名为 .venv.nosync 仍会被标记。
    verification: 清除标记后等待 30 秒再检查，标记不再出现，导入正常；pytest 75 个通过。
    note: 同在桌面下的其他 Python 项目（如 data-agent）可能有同样问题。
