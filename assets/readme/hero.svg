<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">无人机光伏巡检多 Agent 系统</title>
  <desc id="desc">一句话下达巡检任务，多个 Agent 分工完成规划、安全校验、飞行、近距复核和报告；示意图为场地俯视：电子围栏、禁飞区、光伏阵列、绕开禁飞区的航线，以及一块被标出裂纹并近距复核的板。</desc>
